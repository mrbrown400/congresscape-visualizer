[tool.poetry]
name = "congresscape-backend"
version = "0.1.0"
description = "FastAPI backend for real-time U.S. government activity feed"
authors = ["Congresscape Team <team@congresscape.com>"]
readme = "README.md"
packages = [{ include = "app" }]

[tool.poetry.dependencies]
python = "^3.11"
fastapi = "^0.110.0"
uvicorn = { extras = ["standard"], version = "^0.29.0" }
sqlalchemy = "^2.0.0"
asyncpg = "^0.29.0"
psycopg = { extras = ["binary"], version = "^3.1.18" }
pgvector = "^0.2.5"
pydantic = "^2.6.0"
pydantic-settings = "^2.2.1"
alembic = "^1.13.1"
greenlet = "^3.0.0"
structlog = "^24.1.0"
python-dotenv = "^1.0.1"
httpx = "^0.26.0"
openai = "^1.14.0"
redis = "^5.0.1"
celery = "^5.3.6"
loguru = "^0.7.2"
tenacity = "^8.2.3"
requests-cache = "^1.1.1"
juriscraper = "^2.6.92"
lxml = "^5.1.0"

[tool.poetry.group.dev.dependencies]
pytest = "^8.0.0"
pytest-asyncio = "^0.23.5"
httpx = { extras = ["cli"], version = "^0.26.0" }
ruff = "^0.1.15"
pre-commit = "^3.6.2"

[build-system]
requires = ["poetry-core>=1.0.0"]
build-backend = "poetry.core.masonry.api"
